<html>
  <head>
    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const myGc = urlParams.get('gc');
        if (myGc) {
          const gcInput = document.querySelector("#gci");
          gcInput.value = myGc;
        }
      });
    </script>
  </head>
  <body>
    <h1>QUANTUM PASSWORD CHASE</h1>
    <p>Welcome to this site. I'm so glad you unlocked this secret portal. Select your team and enter the correct password to win.</p>
    <form action="/api/fake-api/passchase/submit" method="POST">
      <div>
        <p>Game Code: <input type="text" name="gc" id="gci"></p>

      </div>
      <div>
        <p>Team: <input type="radio" name="team" value="T">Tails // <input type="radio" name="team" value="H">Heads</p>
      </div>
      <div>
        <p>Password: <input type="text" name="password"></p>
      </div>
      <div>
        <input type="submit">
      </div>
    </form>
  </body>
</html>
